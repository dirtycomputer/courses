<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>复旦研究生蹭课指南 · 2026秋</title>
<style>
:root{--blue:#1660a8;--blue-d:#0d4275;--bg:#f5f7fa;--line:#e3e8ef;--txt:#1f2937;--muted:#6b7280;--green:#0a7d43;--red:#c2372e;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:linear-gradient(135deg,var(--blue-d),var(--blue));color:#fff;padding:22px 24px 18px}
header h1{font-size:22px;font-weight:600}
header .sub{margin-top:6px;font-size:12.5px;opacity:.85;line-height:1.6}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
.filters{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.filters-inner{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;outline:none}
.filters input[type=search]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,96,168,.12)}
.filters select{padding:8px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;max-width:190px;outline:none}
.day-btns{display:flex;gap:4px;flex-wrap:wrap}
.day-btns button{padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;cursor:pointer;color:var(--txt)}
.day-btns button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.day-btns button:only-child.on{background:#fff;color:var(--muted);border-color:var(--line)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin:10px 2px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--blue)}
table{width:100%;min-width:1180px;border-collapse:separate;border-spacing:0;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.table-scroll{border-radius:10px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px;white-space:nowrap}
thead th:first-child{border-top-left-radius:10px}
thead th:last-child{border-top-right-radius:10px}
th{position:sticky;top:140px;background:#eef2f7;font-weight:600;font-size:12.5px;color:#374151;z-index:10;white-space:nowrap}
tbody tr:hover{background:#f2f7fd}
td.kcmc-cell{white-space:normal;min-width:150px;max-width:230px;font-weight:500}
td.sj-cell{white-space:normal;min-width:200px;max-width:330px;color:#374151;font-size:12.5px;line-height:1.55}
td.rkjs-cell{white-space:normal;min-width:64px;max-width:110px}
td.name-sub{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
a.syl{color:var(--blue);text-decoration:none;font-weight:500}
a.syl:hover{text-decoration:underline}
.none{color:#9aa4b2}
.empty-tip{text-align:center;padding:40px 0;color:var(--muted)}
.view-switch{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.view-switch button{padding:8px 14px;border:none;background:#fff;font-size:13px;cursor:pointer;color:var(--txt)}
.view-switch button.on{background:var(--blue);color:#fff;font-weight:500}
.cal-wrap{display:none}
.cal-head{display:flex;align-items:center;gap:10px;margin:12px 2px}
.cal-head .wk{font-size:15px;font-weight:600;color:var(--blue);min-width:76px;text-align:center}
.cal-head button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;cursor:pointer}
.cal-head button:disabled{opacity:.35;cursor:default}
.cal-head .hint{font-size:12px;color:var(--muted);margin-left:auto}
.cal-scroll{overflow-x:auto;border-radius:10px;box-shadow:0 1px 3px rgba(16,24,40,.08);background:#fff}
.cal-grid{display:grid;grid-template-columns:52px repeat(7,minmax(88px,1fr));gap:3px;padding:10px;min-width:760px}
.cal-grid .hd{text-align:center;font-size:12.5px;font-weight:600;color:#374151;padding:6px 0;background:#eef2f7;border-radius:6px}
.cal-grid .hd.today{background:var(--blue);color:#fff}
.cal-grid .tm{display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);background:#f2f5f9;border-radius:6px}
.cal-cell{min-height:40px;border-radius:6px;background:#f7f9fc;border:1px solid transparent;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:default}
.cal-cell.has{cursor:pointer;background:#e8f1fa;color:var(--blue-d);font-weight:600;border-color:#d3e4f5}
.cal-cell.has:hover{border-color:var(--blue);box-shadow:0 0 0 2px rgba(22,96,168,.15)}
.cal-cell.h1{background:#e3eefb}.cal-cell.h2{background:#c6ddf5}.cal-cell.h3{background:#a3c8ee;color:#0d4275}.cal-cell.h4{background:#7aaee4;color:#fff}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px}
.modal{background:#fff;border-radius:12px;max-width:960px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(16,24,40,.25)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head .t{font-size:16px;font-weight:600;color:var(--blue-d)}
.modal-head .sub{font-size:12.5px;color:var(--muted)}
.modal-head .x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;color:var(--muted)}
.modal-filters{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);align-items:center}
.modal-filters select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;max-width:190px;outline:none}
.modal-filters .rst{font-size:12.5px;color:var(--muted);margin-left:auto}
.modal-filters .rst b{color:var(--blue)}
.modal-body{overflow-y:auto;padding:6px 18px 14px}
.mp-item{padding:10px 2px;border-bottom:1px solid #eef1f5;font-size:13px}
.mp-item:last-child{border-bottom:none}
.mp-item .l1{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.mp-item .nm{font-weight:600;font-size:13.5px}
.mp-item .bj{color:var(--muted);font-size:12px}
.mp-item .tags{display:flex;gap:6px;flex-wrap:wrap}
.mp-item .tag{font-size:11.5px;color:#475569;background:#f1f5f9;border-radius:5px;padding:1px 7px}
.mp-item .l2{margin-top:3px;color:#374151;font-size:12.5px;line-height:1.55}
.mp-item .js{color:var(--muted);font-size:12px;margin-top:2px}
footer{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.8}
@media(max-width:640px){header{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>复旦研究生蹭课指南</h1>
  <div class="sub">2026-2027学年 第一学期 · 全校研究生课程（按班级计）2984 门 · 70 个开课单位<br>
  点击"大纲"可查看教务系统公开教学大纲（无需登录） · 数据来自研究生选课系统，抓取于 2026-09-18</div>
</header>
<div class="wrap">

      </div>

      </div>
    </div>
  </div>
  <div id="view-list">
  <div class="meta"><span>当前显示 <b id="cnt">0</b> 门课程</span><span id="cnt2"></span></div>
  <div class="table-scroll">
  <table>
    <thead><tr>
      <th>课程代码</th><th>课程名称</th><th>教师</th><th>学分</th><th>层次</th><th>上课时间地点</th><th>校区</th><th>开课单位</th><th>大纲</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  </div>
  <div class="empty-tip" id="empty" style="display:none">没有符合条件的课程，试试放宽筛选条件</div>
  </div>
  <div id="view-cal" class="cal-wrap">
    <div class="cal-head">
      <button id="wk-prev">‹</button>
      <span class="wk" id="wk-label">第1周</span>
      <button id="wk-next">›</button>
      <span class="hint" id="cal-hint"></span>
    </div>
    <div class="cal-scroll"><div class="cal-grid" id="cal-grid"></div></div>
  </div>
  <footer>
    说明：<br>
    · 课程人数与容量信息已省略，如需查看请到研究生选课系统；<br>
    · 部分课程"大纲"列无链接，表示教务系统未收录该课程大纲；<br>
    · 校区包括邯郸、江湾、枫林、张江及校外/在线等；蹭课请尊重课堂秩序，选课请通过研究生选课系统。
  </footer>
</div>
<div class="modal-mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <span class="t" id="mp-title"></span>
      <span class="sub" id="mp-sub"></span>
      <button class="x" id="mp-close">✕</button>
    </div>
    <div class="modal-filters">
      <select id="mp-cc"><option value="">全部层次</option></select>
      <select id="mp-xq"><option value="">全部校区</option></select>
      <select id="mp-yx"><option value="">全部开课单位</option></select>
      <span class="rst">共 <b id="mp-cnt">0</b> 门</span>
    </div>
    <div class="modal-body" id="mp-body"></div>
  </div>
</div>

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
  const q = state.q.trim().toLowerCase();
  const rows = [];
  let shown = 0;
  for (const c of DATA){
    if (state.xq && c.xq !== state.xq) continue;
    if (state.yx && c.yx !== state.yx) continue;
    if (state.cc && c.kccc !== state.cc) continue;
    if (state.xw && c.syxw !== state.xw) continue;
    if (state.day && !(c.days||[]).includes(state.day)) continue;
    if (q && !(c.kcmc.toLowerCase().includes(q) || c.kcdm.toLowerCase().includes(q) || c.rkjs.toLowerCase().includes(q))) continue;
    shown++;
    const syl = c.by1 ? `<a class="syl" href="https://fdjwgl.fudan.edu.cn/manager/teaching-syllabus/open-info/${c.by1}" target="_blank" rel="noopener">大纲</a>` : '<span class="none">—</span>';
    rows.push(`<tr>
      <td>${esc(c.kcdm)}</td>
      <td class="kcmc-cell">${esc(c.kcmc)}${c.bj?`<span class="name-sub">${esc(c.bj)}班</span>`:''}</td>
      <td class="rkjs-cell">${esc(c.rkjs)||'—'}</td>
      <td>${c.xf}</td>
      <td>${esc(c.kccc)||'—'}</td>
      <td class="sj-cell">${esc(c.sjdd)||'—'}</td>
      <td>${esc(c.xq)||'—'}</td>
      <td>${esc(c.yx)||'—'}</td>
      <td>${syl}</td>
    </tr>`);
  }
  $('#tb').innerHTML = rows.join('');
  $('#cnt').textContent = shown;
  $('#cnt2').textContent = `全校共 ${DATA.length} 门`;
  $('#empty').style.display = shown ? 'none' : 'block';
}

function pool(){
  const q = state.q.trim().toLowerCase();
  return DATA.filter(c =>
    (!state.xq || c.xq === state.xq) &&
    (!state.yx || c.yx === state.yx) &&
    (!state.cc || c.kccc === state.cc) &&
    (!state.xw || c.syxw === state.xw) &&
    (!q || c.kcmc.toLowerCase().includes(q) || c.kcdm.toLowerCase().includes(q) || c.rkjs.toLowerCase().includes(q)));
}
let view = 'list';
function refresh(){ render(); if (view === 'cal') renderCal(); }

let tmr;
$('#q').addEventListener('input', e => { clearTimeout(tmr); tmr = setTimeout(() => { state.q = e.target.value; refresh(); }, 120); });

$('#day-btns').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;

});

  $('#day-btns').style.display = v === 'cal' ? 'none' : '';
  closePanel();
  if (v === 'cal') renderCal();
}
$('#v-list').addEventListener('click', () => setView('list'));
$('#v-cal').addEventListener('click', () => setView('cal'));

function renderCal(){
  $('#wk-label').textContent = `第${calWeek}周`;
  $('#wk-prev').disabled = calWeek <= 1;
  $('#wk-next').disabled = calWeek >= MAXW;
  const poolC = pool();
  // grid[节][天] = 课程集合（同一格去重）
  const grid = {};
  for (const c of poolC)
    for (const s of c.slots)
      if (s.w.includes(calWeek))
        for (let p = s.s; p <= s.e; p++){
          (grid[p] = grid[p] || {});
          (grid[p][s.d] = grid[p][s.d] || new Set()).add(c);
        }
  const nowD = new Date();
  const today = ((nowD.getDay() + 6) % 7) + 1;
  const inSem = nowD >= SEM_START && (Math.floor((nowD - SEM_START) / 86400000) < MAXW * 7);
  let html = '<div></div>';
  for (let d = 1; d <= 7; d++)
    html += `<div class="hd${d === today && inSem ? ' today' : ''}">${DAYN[d]}${d === today && inSem ? '·今' : ''}</div>`;
  for (let p = 1; p <= MAXSEC; p++){
    html += `<div class="tm">${p}</div>`;
    for (let d = 1; d <= 7; d++){
      const arr = grid[p] && grid[p][d] ? [...grid[p][d]] : [];
      if (!arr.length){ html += '<div class="cal-cell"></div>'; continue; }
      const h = arr.length >= 10 ? 'h4' : arr.length >= 5 ? 'h3' : arr.length >= 2 ? 'h2' : 'h1';
      html += `<div class="cal-cell has ${h}" data-d="${d}" data-p="${p}" title="第${calWeek}周 ${DAYN[d]} 第${p}节 · ${arr.length} 门课">${arr.length}</div>`;
    }
  }
  $('#cal-grid').innerHTML = html;
  $('#cal-hint').textContent = `当前筛选 ${poolC.length} 门课 · 点击格子查看该时段开课课程`;
}
$('#wk-prev').addEventListener('click', () => { if (calWeek > 1){ calWeek--; closePanel(); renderCal(); } });
$('#wk-next').addEventListener('click', () => { if (calWeek < MAXW){ calWeek++; closePanel(); renderCal(); } });
$('#cal-grid').addEventListener('click', e => {
  const cell = e.target.closest('.cal-cell.has');
  if (cell) openPanel(+cell.dataset.d, +cell.dataset.p);
});

// ---------- 时段课程弹层 ----------
const mp = {day:0, sec:0, cc:'', xq:'', yx:''};
let mpPool = [];
function fillSel(sel, vals, label){
  const el = $(sel);
  el.innerHTML = '';
  el.append(new Option(label, ''));
  [...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh')).forEach(v => el.append(new Option(v, v)));
}
function openPanel(d, p){
  mp.day = d; mp.sec = p; mp.cc = mp.xq = mp.yx = '';
  mpPool = [...new Set(pool().filter(c => c.slots.some(s => s.w.includes(calWeek) && s.d === d && s.s <= p && p <= s.e)))];
  mpPool.sort((a,b) => (a.yx + a.kcdm + a.bj).localeCompare(b.yx + b.kcdm + b.bj, 'zh'));
  fillSel('#mp-cc', mpPool.map(c => c.kccc), '全部层次');
  fillSel('#mp-xq', mpPool.map(c => c.xq), '全部校区');
  fillSel('#mp-yx', mpPool.map(c => c.yx), '全部开课单位');
  $('#mp-cc').value = ''; $('#mp-xq').value = ''; $('#mp-yx').value = '';
  $('#mp-title').textContent = `第${calWeek}周 · ${DAYN[d]} · 第${p}节`;
  $('#mp-sub').textContent = `该时段开课（含跨节次课程）`;
  $('#mask').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  renderPanel();
}
function renderPanel(){
  const list = mpPool.filter(c =>
    (!mp.cc || c.kccc === mp.cc) && (!mp.xq || c.xq === mp.xq) && (!mp.yx || c.yx === mp.yx));
  $('#mp-cnt').textContent = list.length;
  $('#mp-body').innerHTML = list.map(c => {
    const syl = c.by1 ? `<a class="syl" href="https://fdjwgl.fudan.edu.cn/manager/teaching-syllabus/open-info/${c.by1}" target="_blank" rel="noopener">大纲</a>` : '<span class="none">—</span>';
    return `<div class="mp-item">
      <div class="l1">
        <span class="nm">${esc(c.kcmc)}</span>${c.bj ? `<span class="bj">${esc(c.bj)}班</span>` : ''}
        <span class="tag">${esc(c.kccc) || '—'}</span><span class="tag">${esc(c.xq) || '—'}</span><span class="tag">${esc(c.yx) || '—'}</span><span class="tag">${c.xf}学分</span>
        <span style="margin-left:auto">${syl}</span>
      </div>
      <div class="l2">${esc(c.sjdd) || '—'}</div>
      <div class="js">${esc(c.kcdm)} · ${esc(c.rkjs) || '教师未定'}</div>
    </div>`;
  }).join('') || '<div class="empty-tip">该筛选条件下没有课程</div>';
}
function closePanel(){
  $('#mask').style.display = 'none';
  document.body.style.overflow = '';
}
$('#mp-cc').addEventListener('change', e => { mp.cc = e.target.value; renderPanel(); });
$('#mp-xq').addEventListener('change', e => { mp.xq = e.target.value; renderPanel(); });
$('#mp-yx').addEventListener('change', e => { mp.yx = e.target.value; renderPanel(); });
$('#mp-close').addEventListener('click', closePanel);
$('#mask').addEventListener('click', e => { if (e.target === $('#mask')) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

render();
const setSticky = () => {
  const t = document.querySelector('.filters').offsetHeight + 6 + 'px';
  document.querySelectorAll('th').forEach(x => x.style.top = t);
};
setSticky(); window.addEventListener('resize', setSticky);
</script>
</body>
</html>
